# 炎火云 NextChat（本仓库定制镜像：写死 CPA 代理 + 启动拉 models + 顶栏切模型）
# 构建：docker compose -f docker-compose.yanhua.yml build
# 启动：docker compose -f docker-compose.yanhua.yml up -d
services:
  nextchat:
    build: .
    image: nextchat-yanhua:local
    container_name: nextchat
    restart: always
    ports:
      - "3000:3000"
    environment:
      - CODE=${CODE:-nextchat-mio}
      # 写死走机内 CPA（OpenAI 兼容，不要 /v1）
      - BASE_URL=${BASE_URL:-http://host.docker.internal:8317}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-mio-api-key}
      # 隐藏页面自填 Key，统一用服务端
      - HIDE_USER_API_KEY=${HIDE_USER_API_KEY:-1}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-gpt-5.5}
      - DISABLE_GPT4=${DISABLE_GPT4:-}
      - ENABLE_BALANCE_QUERY=${ENABLE_BALANCE_QUERY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
